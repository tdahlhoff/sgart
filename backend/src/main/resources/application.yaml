server:
  # Keycloak already owns port 8080 in local dev (docker-compose.yml) — the backend needs a
  # different port so `./gradlew bootRun` and `docker compose up` can run side by side.
  port: ${SGART_SERVER_PORT:8081}

spring:
  application:
    name: sgart
  # No profile is active by default in local dev, CI, or this test suite — all of them should behave
  # like "dev". A real deployment sets the standard SPRING_PROFILES_ACTIVE env var (e.g. to "prod")
  # to opt out of dev-only defaults such as the invite HMAC secret below.
  profiles:
    default: dev
  # The JWK set is fetched lazily on first token verification, never at context startup — unlike
  # `issuer-uri`, `jwk-set-uri` triggers no eager OIDC-discovery call, so the context loads cleanly
  # even when Keycloak is unreachable (see SgartApplicationTest and Story 1.4 Dev Notes).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SGART_KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/sgart/protocol/openid-connect/certs}
  # PostgreSQL read side (Story 1.6): durable Identity ACL mapping + household read model.
  # HikariCP builds its pool lazily (no-arg construction + property setters), so simply having
  # this DataSource bean does not connect at context startup; only the first real query does.
  datasource:
    url: ${SGART_POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/sgart}
    username: ${SGART_POSTGRES_USER:sgart}
    password: ${SGART_POSTGRES_PASSWORD:}
  # Unlike the lazy DataSource pool above, Flyway validates and connects eagerly at startup — the
  # #1 way this story's Postgres wiring would break contextLoads() with the database down (see
  # SgartApplicationTest / the new ContextLoadsWithoutPostgresTest). Off by default (safe for
  # tests/CI with no database); a real local run against `docker compose up`'s Postgres sets
  # SGART_FLYWAY_ENABLED=true to actually apply migrations. Testcontainers integration tests run
  # Flyway explicitly against their own container instead of relying on this flag.
  flyway:
    enabled: ${SGART_FLYWAY_ENABLED:false}

# Custom (non-Boot-standard) keys: Boot's resource-server auto-configuration only validates
# token expiry from jwk-set-uri alone, so the issuer and audience are checked explicitly by the
# JwtDecoder bean in SecurityConfig (AC1 — issuer/audience checked).
sgart:
  security:
    jwt:
      issuer: ${SGART_KEYCLOAK_ISSUER:http://localhost:8080/realms/sgart}
      audience: sgart-backend
  # Real KurrentDB EventStore adapter (Story 1.6, deferred from 1.5). The client's gRPC channel
  # connects lazily on first RPC, never at context startup (see ContextLoadsWithoutKurrentDbTest).
  kurrentdb:
    connection-string: ${SGART_KURRENTDB_CONNECTION_STRING:esdb://localhost:2113?tls=false}
  # The household read-model projector's live KurrentDB subscription (first CQRS read side). Off by
  # default so tests/CI never open a subscription with KurrentDB down (like SGART_FLYWAY_ENABLED); a
  # real run against `docker compose up`'s KurrentDB sets SGART_PROJECTOR_AUTOSTART=true to populate
  # the household read model that first-run routing reads (AC2).
  projector:
    auto-start: ${SGART_PROJECTOR_AUTOSTART:false}
  # Invite email HMAC secret (Story 4.1, AD-6): a stable per-deployment secret, never a per-invite
  # salt — the same email must always hash to the same digest for the AC2 duplicate-pending check
  # to hold. No default here: outside the "dev" profile (see the profile document below), a missing
  # SGART_INVITE_EMAIL_HMAC_SECRET fails context startup rather than silently falling back to a
  # known, committed secret in production.
  invite:
    email-hmac-secret: ${SGART_INVITE_EMAIL_HMAC_SECRET}
---
# Dev-only defaults (active whenever no other profile is set — see spring.profiles.default above).
# Local runs, CI, and this test suite all get a working default HMAC secret without configuration;
# a real deployment activates a non-"dev" profile and must supply the real secret explicitly.
spring:
  config:
    activate:
      on-profile: dev

sgart:
  invite:
    email-hmac-secret: ${SGART_INVITE_EMAIL_HMAC_SECRET:local-dev-only-invite-hmac-secret-change-me}
