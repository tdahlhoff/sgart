server:
  # Keycloak already owns port 8080 in local dev (docker-compose.yml) — the backend needs a
  # different port so `./gradlew bootRun` and `docker compose up` can run side by side.
  port: ${SGART_SERVER_PORT:8081}

management:
  health:
    mail:
      # spring-boot-starter-mail's auto-configured health indicator opens a live SMTP connection
      # test — but Story 7.3's mail sending is itself config-gated off by default (sgart.identity.
      # mail.enabled=false), so a reachable SMTP server is never a startup precondition (mirrors
      # SGART_FLYWAY_ENABLED/SGART_PROJECTOR_AUTOSTART staying off so contextLoads/health stays
      # green with no live dependency). Off unconditionally: even a real deployment's health check
      # should not flap on transient SMTP hiccups for a non-critical, best-effort notification path.
      enabled: false

spring:
  application:
    name: sgart
  # No profile is active by default in local dev, CI, or this test suite — all of them should behave
  # like "dev". A real deployment sets the standard SPRING_PROFILES_ACTIVE env var (e.g. to "prod")
  # to opt out of dev-only defaults such as the invite HMAC secret below.
  profiles:
    default: dev
  # The JWK set is fetched lazily on first token verification, never at context startup — unlike
  # `issuer-uri`, `jwk-set-uri` triggers no eager OIDC-discovery call, so the context loads cleanly
  # even when Keycloak is unreachable (see SgartApplicationTest and Story 1.4 Dev Notes).
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SGART_KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/sgart/protocol/openid-connect/certs}
  # PostgreSQL read side (Story 1.6): durable Identity ACL mapping + household read model.
  # HikariCP builds its pool lazily (no-arg construction + property setters), so simply having
  # this DataSource bean does not connect at context startup; only the first real query does.
  datasource:
    url: ${SGART_POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/sgart}
    username: ${SGART_POSTGRES_USER:sgart}
    password: ${SGART_POSTGRES_PASSWORD:}
  # Unlike the lazy DataSource pool above, Flyway validates and connects eagerly at startup — the
  # #1 way this story's Postgres wiring would break contextLoads() with the database down (see
  # SgartApplicationTest / the new ContextLoadsWithoutPostgresTest). Off by default (safe for
  # tests/CI with no database); a real local run against `docker compose up`'s Postgres sets
  # SGART_FLYWAY_ENABLED=true to actually apply migrations. Testcontainers integration tests run
  # Flyway explicitly against their own container instead of relying on this flag.
  flyway:
    enabled: ${SGART_FLYWAY_ENABLED:false}
  # SGART's own SMTP send for recovery codes (Story 7.3, design §3.1) — only read when
  # sgart.identity.mail.enabled=true selects the real JavaMailSenderRecoveryCodeEmail adapter;
  # building this JavaMailSender bean performs no I/O either way.
  mail:
    host: ${SGART_SMTP_HOST:localhost}
    port: ${SGART_SMTP_PORT:587}
    username: ${SGART_SMTP_USERNAME:}
    password: ${SGART_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Custom (non-Boot-standard) keys: Boot's resource-server auto-configuration only validates
# token expiry from jwk-set-uri alone, so the issuer and audience are checked explicitly by the
# JwtDecoder bean in SecurityConfig (AC1 — issuer/audience checked).
sgart:
  security:
    jwt:
      issuer: ${SGART_KEYCLOAK_ISSUER:http://localhost:8080/realms/sgart}
      audience: sgart-backend
  # Real KurrentDB EventStore adapter (Story 1.6, deferred from 1.5). The client's gRPC channel
  # connects lazily on first RPC, never at context startup (see ContextLoadsWithoutKurrentDbTest).
  kurrentdb:
    connection-string: ${SGART_KURRENTDB_CONNECTION_STRING:esdb://localhost:2113?tls=false}
  # The household read-model projector's live KurrentDB subscription (first CQRS read side). Off by
  # default so tests/CI never open a subscription with KurrentDB down (like SGART_FLYWAY_ENABLED); a
  # real run against `docker compose up`'s KurrentDB sets SGART_PROJECTOR_AUTOSTART=true to populate
  # the household read model that first-run routing reads (AC2).
  projector:
    auto-start: ${SGART_PROJECTOR_AUTOSTART:false}
  # Invite email HMAC secret (Story 4.1, AD-6): a stable per-deployment secret, never a per-invite
  # salt — the same email must always hash to the same digest for the AC2 duplicate-pending check
  # to hold. No default here: outside the "dev" profile (see the profile document below), a missing
  # SGART_INVITE_EMAIL_HMAC_SECRET fails context startup rather than silently falling back to a
  # known, committed secret in production.
  invite:
    email-hmac-secret: ${SGART_INVITE_EMAIL_HMAC_SECRET}
    # Invite link factory (Story 4.6, AC6): the single configurable base URL every invite link is
    # built from — the exact form the deep link, the web fallback page, and InviteLink.tryParse
    # (Flutter) all consume.
    base-url: ${SGART_INVITE_BASE_URL:http://localhost:8081/invite}
    # The dedicated public PKCE client the web fallback page (Story 4.6, D3) authenticates with —
    # isolates web origins/redirects from the native app's sgart-app client (keycloak/realm-sgart.json).
    web-client-id: ${SGART_INVITE_WEB_CLIENT_ID:sgart-web-invite}
  # Live sync (Story 4.4): the per-household SSE stream's heartbeat cadence and the emitter's own
  # async timeout. The heartbeat interval must stay shorter than any intermediary proxy's idle
  # timeout so a live-but-quiet connection isn't dropped. The emitter timeout is 0 (Servlet-spec
  # "no timeout") because a persistent stream must outlive spring.mvc.async's ~30s default — passing
  # a non-null per-emitter timeout overrides that default for this endpoint only, so the global MVC
  # property is left untouched.
  live-sync:
    heartbeat-interval-seconds: ${SGART_LIVE_SYNC_HEARTBEAT_INTERVAL_SECONDS:15}
    emitter-timeout-ms: ${SGART_LIVE_SYNC_EMITTER_TIMEOUT_MS:0}
  # Content-free background push (Story 4.5, D2): off by default everywhere, so the hermetic
  # LoggingContentFreePushSender is the wired default (tests/CI/local dev never need live FCM
  # credentials). A real deployment that has completed the manual Firebase Admin SDK + credentials
  # wiring (docs/first-real-world-test) sets SGART_PUSH_FCM_ENABLED=true to switch transports.
  push:
    fcm:
      enabled: ${SGART_PUSH_FCM_ENABLED:false}
  identity:
    # Keycloak Admin email→user lookup (Story 4.6, D4): off by default everywhere, so the hermetic
    # DeferredFindHouseholdMemberByEmail stays wired (tests/CI/local dev never need admin credentials).
    # A real deployment that has completed the manual confidential-admin-client wiring
    # (docs/first-real-world-test) sets SGART_IDENTITY_KEYCLOAK_ADMIN_ENABLED=true to switch adapters.
    # No default for client-secret outside the "dev" profile: enabling this without a real secret
    # fails context startup rather than silently using a known, committed one in production.
    keycloak-admin:
      enabled: ${SGART_IDENTITY_KEYCLOAK_ADMIN_ENABLED:false}
      base-url: ${SGART_IDENTITY_KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
      realm: ${SGART_IDENTITY_KEYCLOAK_ADMIN_REALM:sgart}
      client-id: ${SGART_IDENTITY_KEYCLOAK_ADMIN_CLIENT_ID:sgart-admin}
      client-secret: ${SGART_IDENTITY_KEYCLOAK_ADMIN_CLIENT_SECRET}
    # Silent account provisioning (Story 7.1, D-C, AC5): a never-activated shell — a Keycloak
    # account with no MemberMapping and no attached email — is swept (Keycloak account + row both
    # deleted) this many days after it was provisioned. The GDPR storage-limitation control.
    provisioning:
      retention-days: ${SGART_IDENTITY_PROVISIONING_RETENTION_DAYS:14}
      sweep-cron: ${SGART_IDENTITY_PROVISIONING_SWEEP_CRON:0 0 3 * * *}
    # Recover-by-email one-time codes (Story 7.3, D-E): HMAC-SHA256 over the code with a stable
    # per-deployment secret — mirrors sgart.invite.email-hmac-secret's discipline. No default here:
    # outside the "dev" profile, a missing SGART_IDENTITY_EMAIL_RECOVERY_CODE_HMAC_SECRET fails
    # context startup rather than silently falling back to a known, committed secret in production.
    email-recovery:
      code-hmac-secret: ${SGART_IDENTITY_EMAIL_RECOVERY_CODE_HMAC_SECRET}
    # SGART's own SMTP send for recovery codes (Story 7.3, design §3) — off by default everywhere,
    # so the hermetic DeferredSendRecoveryCodeEmail stays wired (tests/CI/local dev never need a
    # live SMTP server). A real deployment that has completed the netcup SMTP + SPF/DKIM setup
    # (docs/first-real-world-test.md) sets SGART_IDENTITY_MAIL_ENABLED=true to switch adapters.
    mail:
      enabled: ${SGART_IDENTITY_MAIL_ENABLED:false}
      from: ${SGART_IDENTITY_MAIL_FROM:no-reply@sgart.example}
    # Consent capture (Story 7.4, D-D/D-E): the single source of the current privacy-notice/terms
    # version. GET /api/v1/consent returns it so the client never hard-codes it — bumping it is a
    # one-line deploy, not an app release (design §8 F2). A plain string, compared for equality
    # (F1) — no ordered parsing.
    consent:
      notice-version: ${SGART_IDENTITY_CONSENT_NOTICE_VERSION:2026-beta-1}
---
# Dev-only defaults (active whenever no other profile is set — see spring.profiles.default above).
# Local runs, CI, and this test suite all get a working default HMAC secret without configuration;
# a real deployment activates a non-"dev" profile and must supply the real secret explicitly.
spring:
  config:
    activate:
      on-profile: dev

sgart:
  invite:
    email-hmac-secret: ${SGART_INVITE_EMAIL_HMAC_SECRET:local-dev-only-invite-hmac-secret-change-me}
  identity:
    keycloak-admin:
      client-secret: ${SGART_IDENTITY_KEYCLOAK_ADMIN_CLIENT_SECRET:local-dev-only-keycloak-admin-secret-change-me}
    email-recovery:
      code-hmac-secret: ${SGART_IDENTITY_EMAIL_RECOVERY_CODE_HMAC_SECRET:local-dev-only-email-recovery-hmac-secret-change-me}
